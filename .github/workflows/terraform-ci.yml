name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_company_name: ${{ vars.TF_COMPANY_NAME }}
      TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
      TF_VAR_location: ${{ vars.TF_LOCATION }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_cost_centre: ${{ vars.TF_COST_CENTRE }}
      TF_VAR_key_vault_admin_object_id: ${{ vars.TF_KEY_VAULT_ADMIN_OBJECT_ID }}
      TF_VAR_alert_email_address: ${{ vars.TF_ALERT_EMAIL_ADDRESS }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
      - name: Verify Azure login
        run: az account show --output table   

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color
        
